<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>To-Do List Simple</title>
    <style>
        /* Classe pour la task terminé */
        .fait {
            text-decoration: line-through;
            color: #adb5bd; 
        }
    </style>
</head>
<body class="bg-light">
    <div class="container py-5" style="max-width: 500px;">
        <h2 class="mb-4 text-center">✅ Ma To-Do List</h2>
        
        <div class="input-group mb-3">
            <input type="text" id="taskInput" class="form-control" placeholder="Nouvelle tâche...">
            <button class="btn btn-primary" id="addBtn">Ajouter</button>
        </div>

        <ul id="taskList" class="list-group shadow-sm">
            </ul>
    </div>

    <script src="script.js"></script>

</body>
</html>
