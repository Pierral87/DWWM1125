<!-- Exercice 19 - Compteur de Likes pour les Jeux

Tags : DOM, Event Listener

Objectif : Mettre en pratique la manipulation du DOM et l'utilisation des écouteurs d'événements en JavaScript en créant un compteur de likes simple.

Énoncé :
Créez un compteur de likes qui s'incrémente à chaque clic sur un bouton.

Votre tâche consiste à :

    Créer un Bouton : Ajoutez une balise <button> avec l'ID button
    Afficher le Compteur : Créez une balise où le nombre de likes sera affiché avec l'ID compteur
    Incrémenter le Compteur : Chaque clic sur le bouton doit incrémenter le compteur -->

<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Compteur de Likes chez PixelBay</title>
</head>

<body>
    <button id="button"><span id="compteur">👍 Like </span></button>

    <script>
        // Selection des éléments de la page
        // Le button pour pouvoir ajouter l'event de click
        let button = document.querySelector("#button");
        // Le compteur pour pouvoir ajouter le nombre de like
        let compteur = document.querySelector("#compteur");
        // Une variable count pour compter le nombre de click, par défaut à 0 
        let count = 0;

        function addOne() { // Ici la fonction qui gère le compteur et le contenu texte du compteur
            // console.log("function addOne");
            // console.log(count);
            count++; // Incrémentation du count
            // console.log(count);
            // Ci dessous, remplacement du innerText du span compteur, avec le count concaténé de Like au singulier ou au pluriel en fonction du nombre de likes
            compteur.innerText = count  + ( count == 1 ? " 👍 Like" : " 👍 Likes");
        }

        // Lors du click on lancera la fonction addOne
        button.addEventListener("click", addOne);

        
    </script>
</body>

</html>
