<!-- Exercice 20 - Barre de Progression de Scroll avec Footer

Tags : DOM, Event Listener, Scroll

Objectif : Créer une barre de progression qui suit la position de scrolling de l'utilisateur sur la page.

Contexte : La boutique souhaite améliorer l'expérience utilisateur sur ses fiches produits longues. Une barre de progression visuelle permet aux clients de voir facilement leur progression dans la lecture et de savoir combien de contenu reste à découvrir.

Énoncé :

Créez une barre de progression qui se remplit au fur et à mesure que l'utilisateur scrolle vers le bas de la page.

On a une balise footer vide, mais avec une height de 5px et couleur rouge, la width est à 0%, il va falloir faire évoluer ce 0% en fonction des valeurs de scroll de notre fenêtre -->
<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <title>Barre de Progression de Scroll chez PixelBay</title>
    <style>
        body {
            height: 300vh;
            /* Pour permettre le scroll */
        }

        footer {
            position: fixed;
            bottom: 0;
            left: 0;
            height: 5px;
            background-color: #ff0000;
            width: 0%;
        }
    </style>
</head>

<body>
    <h1>Faites défiler la page pour voir la barre de progression</h1>

    <footer></footer>

    <script>
        // Pour le scroll, il faut profiter du CSS mis en place pour la balise footer
        // On remarque dans le CSS qu'il y a un background color red, et surtout un height à 5px et un width à 0%, le but étant de réussir à prendre en compte à quelle position on se trouve du scroll de la page, pour transformer ça en % pour la width du footer 

        // Selection du footer 

        // Mise en place d'un évenement scroll sur le document 
        // Et ensuite manipulation sur le body de la propriété scrollHeight comparé à innerHeight 
        // document.body.scrollHeight    et window.innerHeight  
        // Ensuite manipulation de scrollY sur window    window.scrollY

        // Calcul du pourcentage avec un calcul entre le window.scrollY et le total Height de la page 

        // Basé sur tout ça, on manipule la width du footer 

        document.addEventListener("DOMContentLoaded", function () {
            const footer = document.querySelector("footer");

            document.addEventListener("scroll", function () {
                let scrollTotalHeight = document.body.scrollHeight - window.innerHeight;
                let scrollCurrentPosition = window.scrollY;
                let scrollPercentage = (scrollCurrentPosition / scrollTotalHeight) * 100;

                footer.style.width = `${scrollPercentage}%`;
            });
        });


    </script>
</body>

</html>
