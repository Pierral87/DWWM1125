<!-- Créez un formulaire d'inscription de votre choix  
 
    Appliquez les contrôles que vous trouvez judicieux sur chacun des champs d'inscription

    Appliquez des contrôles avec JS qui induise des changements de style

    Par exemple affichage d'un message d'erreur en direct,  bordure rouge sur l'input, texte en rouge ou autre chose 

    // Peu importe la taille du formulaire (nombre de champs)
        // On appliquera généralement soit des évènement keydown pour faire des contrôles de valeur EN COURS DE SAISIE ! 
        // C'est à dire, à chaque fois que sur par exemple un input pseudo, j'ai un evenement keydown, je vais récupérer la value du champ  donc  this.value   et vérifier sa length 
        // Via une condition je vérifie la valeur de length et soit j'affiche un message d'erreur soit un message OK (ou rien) pour indiquer que la saisie est bonne ou mauvaise 
        // Je peux le gérer avec un innerHTML 


        // Ou sinon/également lorsqu'on a un event submit sur le form, on va faire un preventDefault avant d'envoyer le formulaire pour éviter qu'il s'envoie avec de mauvaises informations
        // On peut aussi si on le souhaite appliquer les controles seulement une fois que le form est envoyé, mais c'est mieux de les montrer à l'utilisateur en direct 

-->



<!DOCTYPE html>
<html lang="fr">
    <head>
        <!-- Required meta tags -->
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

        <!-- Bootstrap CSS -->
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">

        <!-- font awesome -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.13.0/css/all.min.css">

        <!-- own style -->
        <link rel="stylesheet" href="css/style.css">

        <title>Formulaire</title>
    </head>
    <body>
        
        <div class="container">

            <div class="row">
                <div class="col-12">
                    <div id="carouselExampleIndicators" class="carousel slide" data-ride="carousel">
                        <ol class="carousel-indicators">
                          <li data-target="#carouselExampleIndicators" data-slide-to="0" class="active"></li>
                          <li data-target="#carouselExampleIndicators" data-slide-to="1"></li>
                          <li data-target="#carouselExampleIndicators" data-slide-to="2"></li>
                          <li data-target="#carouselExampleIndicators" data-slide-to="3"></li>
                        </ol>
                        <div class="carousel-inner">
                          <div class="carousel-item active">
                            <img src="img/image1.jpg" class="d-block w-100" alt="image ville">
                          </div>
                          <div class="carousel-item">
                            <img src="img/image2.jpg" class="d-block w-100" alt="image ville">
                          </div>
                          <div class="carousel-item">
                            <img src="img/image3.jpg" class="d-block w-100" alt="image ville">
                          </div>
                          <div class="carousel-item">
                            <img src="img/image4.jpg" class="d-block w-100" alt="image ville">
                          </div>
                        </div>
                        <a class="carousel-control-prev" href="#carouselExampleIndicators" role="button" data-slide="prev">
                          <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                          <span class="sr-only">Previous</span>
                        </a>
                        <a class="carousel-control-next" href="#carouselExampleIndicators" role="button" data-slide="next">
                          <span class="carousel-control-next-icon" aria-hidden="true"></span>
                          <span class="sr-only">Next</span>
                        </a>
                    </div>
                </div>
            </div>

            <div class="row">
                <div class="col-12 mt-4">
                    <h1 class="text-center"><i class="fas fa-user-astronaut text-primary"></i> Inscription <i class="fas fa-user-astronaut text-primary"></i></h1>
                    <form id="formInscription">
                        <div class="form-row">
                            <div class="col-6">




                                <div class="form-group">
                                    <label for="pseudo">Pseudo <i class="fas fa-user text-primary"></i></label>
                                    <input type="text" name="pseudo" class="form-control" value="" id="pseudo">
                                    <span id="messagePseudo"></span>
                                </div>

                                <div class="form-group">
                                    <label for="mdp">Mot de passe <i class="fas fa-eye-slash text-primary" id="afficheMdp" title="Cliquez pour afficher ou cacher le mot de passe"></i></label>
                                    <input type="password" name="mdp" class="form-control" value="" id="mdp">
                                    <span id="messageMdp"></span>
                                </div>

                                <div class="form-group">
                                    <label for="confirm_mdp">Confirmation du mot de passe <i class="fas fa-eye-slash text-primary" id="afficheConfirmMdp" title="Cliquez pour afficher ou cacher le mot de passe"></i></label>
                                    <input type="password" name="confirm_mdp" class="form-control" value="" id="confirm_mdp">
                                    <span id="messageConfirmMdp"></span>
                                </div>

                                <div class="form-group">
                                    <label for="nom">Nom <i class="fas fa-user text-primary"></i></label>
                                    <input type="text" name="nom" class="form-control" value="" id="nom">
                                    <span id="messageNom"></span>
                                </div>

                                <div class="form-group">
                                    <label for="prenom">Prénom <i class="fas fa-user text-primary"></i></label>
                                    <input type="text" name="prenom" class="form-control" value="" id="prenom">
                                    <span id="messagePrenom"></span>
                                </div>

                                <div class="form-group">
                                    <label for="email">Email <i class="fas fa-user text-primary"></i></label>
                                    <input type="text" name="email" class="form-control" value="" id="email">
                                    <span id="messageEmail"></span>
                                </div>



                            </div>
                            <div class="col-6">

                                <div class="form-group">
                                    <label for="sexe">Sexe <i class="fas fa-venus-mars text-primary"></i></label>
                                    <select name="sexe" class="form-control"  id="sexe">
                                        <option>Homme</option>
                                        <option>Femme</option>
                                    </select>
                                    <span id="messageSexe"></span>
                                </div>

                                <div class="form-group">
                                    <label for="adresse">Adresse <i class="fas fa-user text-primary"></i></label>
                                    <textarea name="adresse" class="form-control" id="adresse" rows="1"></textarea>
                                    <span id="messageAdresse"></span>
                                </div>

                                <div class="form-group">
                                    <label for="cp">Code postal <i class="fas fa-user text-primary"></i></label>
                                    <input type="text" name="cp" class="form-control" value="" id="cp">
                                    <span id="messageCp"></span>
                                </div>

                                <div class="form-group">
                                    <label for="ville">Ville <i class="fas fa-city text-primary"></i></label>
                                    <input type="text" name="ville" class="form-control" value="" id="ville">
                                    <span id="messageVille"></span>
                                </div>

                                <div class="form-group">
                                    <label for="telephone">Téléphone <i class="fas fa-phone-square-alt text-primary"></i></label>
                                    <input type="text" name="telephone" class="form-control" value="" id="telephone" placeholder="Format : 0102030405">
                                    <span id="messageTelephone"></span>
                                </div>

                                <div class="form-group"> 
                                    <label for="inscription"> <i class="fas fa-user text-primary"></i></label>                                  
                                    <button type="submit" name="inscription" class="form-control btn btn-outline-primary" value="Inscription" id="inscription"> <i class="fas fa-user text-primary"></i> Inscription <i class="fas fa-user text-primary"></i></button>
                                    <span id="messageInscription"></span>
                                </div>
                                <br>
                                <br>
                                <br>
                                <br>
                                <br>
                                <br>
                                <br>
                                <br>
                            </div>
                        </div>
                    </form>
                </div>
            </div>

        </div>    



















        



        



        <!-- Optional JavaScript -->
        <!-- jQuery first, then Popper.js, then Bootstrap JS -->
        <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>
        <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>


        <!-- Own js -->
        <script src="js/monScript.js"></script>
    </body>
</html>
